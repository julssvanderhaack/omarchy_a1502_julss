# MacBookPro12,1: el kernel aplica el fixup MBA6 (PCI SSID 8086:7270) que desactiva
# el pin 0x13 (woofers). El patch restaura el valor de BIOS. Solo afecta al codec
# CS4208 106b:7b00 gracias a la línea [codec], así que es seguro en ambas tarjetas.
# https://github.com/omacom/omarchy/issues/12217
options snd_hda_intel patch=hda-mbp12-woofers.fw,hda-mbp12-woofers.fw
